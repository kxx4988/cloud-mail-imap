name: Build Docker image (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要全部 tag 才能判断哪个是最新版本

      # latest 只由「版本号最高」的 tag 更新。
      # 否则重建历史 tag（比如补说明后 force push）会把 latest 覆盖成旧镜像。
      - id: highest
        name: 判断是否为最高版本 tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "非 tag 触发，不更新 latest"
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HIGHEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "当前 tag: ${GITHUB_REF_NAME} / 最高 tag: ${HIGHEST}"
          if [ "${HIGHEST}" = "${GITHUB_REF_NAME}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.highest.outputs.is_latest == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
